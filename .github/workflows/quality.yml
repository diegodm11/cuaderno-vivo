name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check accessibility-demo.js
          node --check class-review.js
          node --check classroom.js
          node --check curriculum-engine.js
          node --check learning-capsules.js
          node --check learning-history.js
          node --check reinforcement.js
          node --check profile-i18n.js
          node --check product-core.js
          node --check real-workflow.js
          node --check pwa.js
          node --check service-worker.js
      - name: Build production package
        run: python tools/build_dist.py
      - name: Run static contracts
        run: python -m unittest tests/test_service_worker_contract.py -v
      - name: Start local server
        run: |
          python -m http.server 4180 --directory dist > /tmp/cuaderno-vivo-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4180/ >/dev/null && exit 0
            sleep 0.5
          done
          exit 1
      - name: Run product integrity E2E
        run: python -m unittest tests/test_product_integrity.py -v
